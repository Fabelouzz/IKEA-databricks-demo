[pytest]
# Pytest configuration for IKEA Lakehouse tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --color=yes

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (require Databricks environment)
    slow: Slow-running tests

# Ignore directories
norecursedirs = 
    .git
    .venv
    venv
    notebooks
    data_seed
    visuals
    docs

# Coverage options (if using pytest-cov)
[coverage:run]
source = tests
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

